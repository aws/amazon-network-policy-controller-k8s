name: PR e2e Tests

on:
  issue_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

# Serialize runs per PR so overlapping `/test e2e` comments cannot collide on the
# deterministic cluster name. Queue rather than cancel; cancelling mid-run would leak clusters.
concurrency:
  group: e2e-tests-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  REGION: us-west-2
  INSTANCE_TYPE: t3.large
  ECR_REPO_NAME: amazon/amazon-network-policy-controller-k8s

jobs:
  check-trigger:
    if: |
      github.repository == 'aws/amazon-network-policy-controller-k8s' &&
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/test e2e ')
    runs-on: ubuntu-latest
    outputs:
      pr-sha: ${{ steps.validate-sha.outputs.sha }}
    steps:
      - name: Validate SHA from comment
        id: validate-sha
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permData } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: context.actor
            });
            if (!['admin', 'write'].includes(permData.permission)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `❌ @${context.actor} does not have write permission on this repository.`
              });
              core.setFailed('Insufficient permissions');
              return;
            }

            const comment = context.payload.comment.body.trim();
            const shaMatch = comment.match(/^\/test e2e ([a-f0-9]{40})$/);
            if (!shaMatch) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: '❌ Invalid format. Use: `/test e2e <full-40-char-sha>`'
              });
              core.setFailed('Invalid SHA format');
              return;
            }

            const requestedSHA = shaMatch[1];
            const pr = (await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.issue.number
            })).data;
            if (pr.head.sha !== requestedSHA) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `❌ SHA mismatch!\n- Provided: \`${requestedSHA}\`\n- Current PR head: \`${pr.head.sha}\`\n\nPlease verify the PR has not been updated since review.`
              });
              core.setFailed('SHA mismatch - possible TOCTOU');
              return;
            }

            core.setOutput('sha', requestedSHA);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `✅ e2e tests (cyclonus IPv4 + IPv6, startup scale) triggered by @${context.actor} for \`${requestedSHA}\`. [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            });

  build-image:
    needs: check-trigger
    runs-on: ubuntu-latest
    outputs:
      image-repository: ${{ steps.build.outputs.image_repository }}
      image-tag: ${{ steps.build.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.pr-sha }}
          # git describe in image-push needs tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: "**/go.sum"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Build and push image
        id: build
        run: |
          IMAGE_TAG=$(git rev-parse HEAD)
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          IMAGE_REPOSITORY="$AWS_ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$ECR_REPO_NAME"

          if ! aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" --region "$REGION" >/dev/null 2>&1; then
            echo "creating ECR repo $ECR_REPO_NAME"
            aws ecr create-repository --repository-name "$ECR_REPO_NAME" --region "$REGION"
          fi

          if [[ $(aws ecr batch-get-image --repository-name "$ECR_REPO_NAME" --image-ids imageTag="$IMAGE_TAG" \
              --query 'images[].imageId.imageTag' --region "$REGION") != "[]" ]]; then
            echo "Image $IMAGE_REPOSITORY:$IMAGE_TAG already exists. Skipping image build."
          else
            make ko
            aws ecr get-login-password --region "$REGION" | \
              ./bin/ko login "$AWS_ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com" -u AWS --password-stdin
            make prepare-embed
            make image-push IMG="$IMAGE_REPOSITORY:$IMAGE_TAG" PLATFORM=linux/amd64,linux/arm64
          fi
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  # One leg per IP family. Each leg creates its own cluster, deploys the controller under test on
  # the dataplane, and runs the cyclonus suite. The startup scale test does not depend on the IP
  # family, so it only runs on the IPv4 leg. fail-fast: false so one leg failing does not cancel the other.
  e2e:
    needs: [check-trigger, build-image]
    runs-on: ubuntu-latest
    # cyclonus alone runs ~3h; cluster setup and the startup scale test add ~1h.
    # Cap below the 6h credential/GitHub job limit.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        ip-family: [IPv4, IPv6]
    env:
      IP_FAMILY: ${{ matrix.ip-family }}
      CLUSTER_NAME: npc-e2e-pr-${{ github.event.issue.number }}-${{ matrix.ip-family }}
      KUBECONFIG: ${{ github.workspace }}/.kube/config
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.pr-sha }}

      # PRs opened before the lifecycle script merged check out a head that predates it; fall
      # back to the default-branch copy so /test e2e keeps working on them without a rebase.
      - name: Ensure e2e scripts
        run: |
          if [[ ! -f scripts/eks-test-cluster.sh || ! -d test/e2e/startup ]]; then
            git fetch --depth=1 origin "${{ github.workflow_sha }}"
            git checkout FETCH_HEAD -- scripts test/e2e
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: "**/go.sum"

      - name: Set up eksctl and helm
        run: |
          curl -fsSL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin/
          eksctl version
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
          role-duration-seconds: 21600

      - name: Create EKS cluster (${{ matrix.ip-family }})
        id: create
        run: |
          K8S_VERSION=$(aws eks describe-addon-versions --addon-name vpc-cni --region "$REGION" \
            | jq -r '[.addons[0].addonVersions[0].compatibilities[].clusterVersion] | sort_by(split(".")[1] | tonumber) | .[-2]')
          echo "k8s-version=$K8S_VERSION" >> "$GITHUB_OUTPUT"
          export K8S_VERSION
          ./scripts/eks-test-cluster.sh create

      - name: Deploy controller on dataplane
        env:
          NP_CONTROLLER_IMAGE: ${{ needs.build-image.outputs.image-repository }}
          NP_CONTROLLER_TAG: ${{ needs.build-image.outputs.image-tag }}
        run: ./scripts/deploy-controller-on-dataplane.sh

      - name: Run cyclonus suite
        id: cyclonus
        continue-on-error: true
        env:
          SKIP_CNI_INSTALLATION: "true"
          DISABLE_CP_NETWORK_POLICY_CONTROLLER: "true"
          K8S_VERSION: ${{ steps.create.outputs.k8s-version }}
        run: ./scripts/run-cyclonus-tests.sh

      # Runs after cyclonus because it scales the controller to zero and holds its leader lease.
      - name: Run startup scale test
        id: startup-scale
        if: matrix.ip-family == 'IPv4'
        continue-on-error: true
        env:
          KWOK_UNINSTALL: "true"
        run: make run-startup-scale-test

      - name: Post results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ipFamily = '${{ matrix.ip-family }}';
            const outcomes = {
              cyclonus: '${{ steps.cyclonus.outcome }}',
              'startup scale': '${{ steps.startup-scale.outcome }}',
            };
            const icon = o => o === 'success' ? '✅' : o === 'skipped' || o === '' ? '⏭️' : '❌';
            const failed = Object.values(outcomes).some(o => o !== 'success' && o !== 'skipped' && o !== '');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.issue.number }},
              body: [
                `## e2e Test Results (${ipFamily}): ${failed ? '❌ Failed' : '✅ Passed'}`,
                `- **Commit:** \`${{ needs.check-trigger.outputs.pr-sha }}\``,
                `- **K8s Version:** ${{ steps.create.outputs.k8s-version }}`,
                `- **Image:** \`${{ needs.build-image.outputs.image-repository }}:${{ needs.build-image.outputs.image-tag }}\``,
                ...Object.entries(outcomes).map(([suite, o]) => `- ${icon(o)} ${suite}`),
                `- **[Full logs](${runUrl})**`
              ].join('\n')
            });
            if (failed) core.setFailed(`e2e tests failed (${ipFamily})`);

  cleanup:
    needs: [check-trigger, e2e]
    if: always() && needs.check-trigger.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ip-family: [IPv4, IPv6]
    env:
      CLUSTER_NAME: npc-e2e-pr-${{ github.event.issue.number }}-${{ matrix.ip-family }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-trigger.outputs.pr-sha }}

      # Keep create and delete on the same lifecycle-script revision.
      - name: Ensure cluster lifecycle script
        run: |
          if [[ ! -f scripts/eks-test-cluster.sh ]]; then
            git fetch --depth=1 origin "${{ github.workflow_sha }}"
            git checkout FETCH_HEAD -- scripts/eks-test-cluster.sh
          fi

      - name: Install eksctl
        run: |
          curl -fsSL "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_$(uname -s)_amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin/

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OSS_ROLE_ARN }}
          aws-region: ${{ env.REGION }}
          role-duration-seconds: 3600

      - name: Delete EKS cluster
        run: ./scripts/eks-test-cluster.sh delete
